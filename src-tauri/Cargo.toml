[package]
name = "halfcopy-tauri"
version = "0.1.0"
description = "Halfcopy, but tauri"
authors = ["Skye <me@skye.vg>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "halfcopy_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.100"
async-walkdir = "2.1.0"
blake3 = { version = "1.8.2", features = ["traits-preview"] }
chacha20poly1305 = "0.10.1"
dashmap = "6.1.0"
futures-util = { version = "0.3.31", features = ["futures-sink"] }
hex = "0.4.3"
hkdf = "0.12.4"
iroh = "0.92.0"
iroh-base = "0.92.0"
iroh-blobs = "0.94.0"
irpc = "0.8.0"
itertools = "0.14.0"
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.8.5"
spake2 = { version = "0.4.0", features = ["std"] }
tokio-tungstenite = { version = "0.27.0", features = ["rustls-tls-native-roots"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
tokio = { version = "1.47.1", features = ["fs"] }
tauri-plugin-dialog = "2"

